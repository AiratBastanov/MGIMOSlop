<div><label for="queue-search">Номер или имя заявителя</label><input id="queue-search" name="q" value="{{ queue_filters.q }}" maxlength="80" type="search"></div>
<div><label for="queue-type">Тип</label><select id="queue-type" name="type"><option value="">Все типы</option>{% for key,label in request_types %}<option value="{{ key }}" {% if queue_filters.type == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
<div><label for="queue-group">Текущая группа</label><select id="queue-group" name="group"><option value="">Все обслуживаемые</option>{% for group in queue_groups %}<option value="{{ group.id }}" {% if queue_filters.group == group.id|stringformat:'s' %}selected{% endif %}>{{ group.name }}</option>{% endfor %}</select></div>
<div><label for="queue-clarification">Уточнение</label><select id="queue-clarification" name="clarification"><option value="">Все</option><option value="open" {% if queue_filters.clarification == 'open' %}selected{% endif %}>Ожидаем ответ</option><option value="answered" {% if queue_filters.clarification == 'answered' %}selected{% endif %}>Ответ получен</option><option value="resolved" {% if queue_filters.clarification == 'resolved' %}selected{% endif %}>Уточнение завершено</option></select></div>
