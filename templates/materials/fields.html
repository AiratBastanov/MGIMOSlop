{% if form.non_field_errors %}<div class="field-error">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<p class="form-note">{{ field.help_text }}</p>{% endif %}{% if field.errors %}<div class="field-error">{{ field.errors }}</div>{% endif %}</div>{% endfor %}
